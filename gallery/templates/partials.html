<header>

{{define "ageGate"}}
<div id="age-gate" style="position:fixed;inset:0;z-index:99999;background:rgba(10,10,14,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:420px;width:100%;background:#16161d;border:1px solid #2a2a35;border-radius:16px;padding:32px 28px;text-align:center;color:#e7e7ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div style="font-size:44px;line-height:1;margin-bottom:14px;">🔞</div>
    <h1 style="font-size:20px;font-weight:700;margin:0 0 10px;">本网站包含成人内容</h1>
    <p style="font-size:14px;line-height:1.7;color:#9a9aa8;margin:0 0 22px;">仅面向年满 18 周岁的成年人。本站收录的图片/视频可能包含露骨内容，未成年人与反感者请立即离开。</p>
    <button id="age-gate-enter" type="button" style="width:100%;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;border-radius:10px;cursor:pointer;margin-bottom:10px;">我已年满 18 周岁，进入</button>
    <button id="age-gate-leave" type="button" style="width:100%;padding:12px 16px;font-size:14px;color:#9a9aa8;background:transparent;border:1px solid #2a2a35;border-radius:10px;cursor:pointer;">离开</button>
  </div>
</div>
<script>
(function () {
  var KEY = "tw_age_verified";
  function hide() { var g = document.getElementById("age-gate"); if (g) g.style.display = "none"; }
  function verified() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
  if (verified()) { hide(); }
  else {
    var enter = document.getElementById("age-gate-enter");
    var leave = document.getElementById("age-gate-leave");
    if (enter) enter.addEventListener("click", function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      hide();
    });
    if (leave) leave.addEventListener("click", function () {
      window.location.href = "https://www.bing.com";
    });
  }
})();
</script>
{{end}}
