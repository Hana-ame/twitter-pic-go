{{define "head"}}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · Gallery</title>
<style>
:root{--bg:#111;--fg:#e6e9ef;--muted:#8b93a7;--card:#1b1f2a;--acc:#7aa2f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid #232838;position:sticky;top:0;background:var(--bg);z-index:2;
       display:flex;align-items:center;justify-content:space-between;gap:12px}
header a{color:var(--fg);text-decoration:none;font-weight:600}
.lgbtn{padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid #2b3244;color:var(--muted);
       text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.lgbtn:hover{color:var(--fg);border-color:var(--acc)}
.modes a.lg{margin-left:auto;color:#e0af68;border-color:#3a3325}
.modes a.lg:hover{border-color:#e0af68}
main{padding:20px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--muted)}
.grid{columns:320px;column-gap:16px}
.card{background:var(--card);border-radius:12px;padding:8px;margin:0 0 16px;display:block;width:100%;
      break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
.card img,.card video{width:100%;height:auto;border-radius:8px;background:#0b0d13;display:block;cursor:zoom-in}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#222838;color:var(--muted);font-size:12px}
.modes{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.modes a{padding:7px 14px;border-radius:999px;background:#1b1f2a;color:var(--muted);text-decoration:none;border:1px solid #2b3244;font-size:14px}
.modes a.active{background:#2b3244;color:var(--fg)}
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:22px 0}
.pager .btn{background:#222838;color:var(--fg);border:1px solid #2b3244;border-radius:8px;padding:9px 16px;text-decoration:none;cursor:pointer}
.pager .btn[hidden]{display:none}
footer{padding:24px;text-align:center;color:var(--muted)}
.center{text-align:center}

/* 主页 */
.home{max-width:1200px}
.hero{padding:44px 4px 18px;text-align:center}
.big{font-size:clamp(28px,6vw,42px);margin:0 0 10px;letter-spacing:.5px}
.grad{background:linear-gradient(90deg,#7aa2f7,#bb9af7,#f7768e);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);margin:0 auto 22px;max-width:640px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.search{flex:1;min-width:240px;max-width:480px;background:var(--card);border:1px solid #2b3244;border-radius:999px;
        color:var(--fg);padding:11px 18px;font-size:15px;outline:none}
.search:focus{border-color:var(--acc)}
.tbtn{background:var(--card);border:1px solid #2b3244;color:var(--fg);border-radius:999px;padding:11px 18px;font-size:15px;cursor:pointer}
.tbtn:hover{border-color:var(--acc)}
.a-meta{margin:14px 0 18px;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.acct{display:block;background:var(--card);border:1px solid #232838;border-radius:14px;overflow:hidden;
      text-decoration:none;color:var(--fg);min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.acct:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bnr,.bnr-ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0b0d13}
.bnr-ph{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;
        color:hsl(var(--h,220) 70% 80%);background:linear-gradient(140deg,hsl(var(--h,220) 38% 15%),hsl(var(--h,220) 55% 32%))}
.arow{display:flex;align-items:center;gap:9px;padding:9px 11px;min-width:0}
.av{position:relative;overflow:hidden;flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h,220) 60% 45%)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.col{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.at{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.nk{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nk:empty{display:none}
.tagbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid #2b3244;color:var(--muted);
     border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tag span{font-size:11px;color:#5c6578}
.tag:hover{color:var(--fg);border-color:var(--acc)}
.tag.active{background:linear-gradient(90deg,#2b3f66,#41305c);color:#fff;border-color:var(--acc)}
.tgs{display:flex;flex-wrap:wrap;gap:4px;padding:0 11px 10px}
.tgs:empty{display:none;padding:0}
.tg{font-size:11px;color:var(--acc);background:#1b2536;border-radius:6px;padding:1px 7px;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg.more{color:var(--muted)}

/* ---------- 全屏查看器：手机式（横向翻页 / 缩放 / 下滑关闭） ---------- */
.lb{position:fixed;inset:0;z-index:50;background:#000}
.lb[hidden]{display:none}
.lb-track{display:flex;height:100vh;height:100dvh;overflow-x:auto;overflow-y:hidden;
          scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
          outline:none;will-change:transform}
.lb-slide{flex:0 0 100vw;width:100vw;height:100vh;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;
          display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-x}
.lb-slide.zoomed{touch-action:none}
.lb-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;will-change:transform}
.lb-stage.anim{transition:transform .24s ease}
.lb-media{max-width:100vw;max-height:100vh;max-height:100dvh;width:auto;height:auto;object-fit:contain;background:#000;
          user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
img.lb-media{cursor:pointer}
.lb-playicon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
             font-size:64px;color:rgba(255,255,255,.88);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.lb-slide.paused .lb-playicon{display:flex}

/* chrome：毛玻璃圆形按钮，统一淡入淡出，3.2s 自动隐藏 */
.lb-close,.lb-nav,.lb-rail,.lb-info,.lb-ind{transition:opacity .25s}
.lb.hide-ui .lb-close,.lb.hide-ui .lb-nav,.lb.hide-ui .lb-rail,.lb.hide-ui .lb-info,.lb.hide-ui .lb-ind{opacity:0;pointer-events:none}
.lb-close{position:fixed;top:14px;right:16px;z-index:52;width:44px;height:44px;border-radius:50%;cursor:pointer;
          background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
          border:1px solid rgba(255,255,255,.22);color:#fff;font-size:18px;line-height:1}
.lb-close:hover{background:rgba(255,255,255,.24)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:52;display:none;
        width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;
        background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.18);color:#fff;font-size:30px;opacity:.6;
        -webkit-user-select:none;user-select:none;padding:0}
.lb-nav b{font-weight:400;line-height:1;margin-top:-5px}
.lb-prev{left:18px}
.lb-next{right:18px}
@media (hover:hover) and (pointer:fine){.lb-nav{display:flex}}
.lb-nav:hover{opacity:1;background:rgba(255,255,255,.22)}
.lb-nav.dis{opacity:.15;pointer-events:none}
.lb-ind{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:52;padding:5px 14px;border-radius:999px;
        background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;letter-spacing:.6px}
.lb-rail{position:fixed;right:12px;bottom:36px;z-index:52;display:flex;flex-direction:column;gap:14px;align-items:center}
.lb-act{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.10);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 10px;font-size:18px;cursor:pointer;min-width:52px}
.lb-act:hover{background:rgba(255,255,255,.2)}
.lb-act span{font-size:12px;color:#e6e9ef}
.lb-act.on{background:rgba(255,64,96,.85);border-color:rgba(255,64,96,.9)}
.lb-info{position:fixed;left:16px;bottom:20px;z-index:52;color:#fff;text-shadow:0 1px 3px #000;font-size:14px;opacity:.9}

</style>
</head>
{{end}}

{{define "header"}}
<header>
  <a href="/">Twitter&nbsp;Pic <span class="muted">·</span> Gallery</a>
  {{if .LegacyBase}}<a class="lgbtn" href="{{.LegacyBase}}" rel="noopener" title="切换到旧版界面">🕹 旧版首页</a>{{end}}
</header>
{{end}}

{{define "footer"}}
<footer>server-rendered by Go · html/template</footer>
{{end}}
