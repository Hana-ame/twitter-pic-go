{{define "head"}}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · Gallery</title>
<style>
:root{--bg:#111;--fg:#e6e9ef;--muted:#8b93a7;--card:#1b1f2a;--acc:#7aa2f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 20px;border-bottom:1px solid #232838;position:sticky;top:0;background:var(--bg);z-index:2}
header a{color:var(--fg);text-decoration:none;font-weight:600}
main{padding:20px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--muted)}
.grid{columns:320px;column-gap:16px}
.card{background:var(--card);border-radius:12px;padding:8px;margin:0 0 16px;display:block;width:100%;
      break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
.card img,.card video{width:100%;height:auto;border-radius:8px;background:#0b0d13;display:block;cursor:zoom-in}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#222838;color:var(--muted);font-size:12px}
.modes{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.modes a{padding:7px 14px;border-radius:999px;background:#1b1f2a;color:var(--muted);text-decoration:none;border:1px solid #2b3244;font-size:14px}
.modes a.active{background:#2b3244;color:var(--fg)}
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:22px 0}
.pager .btn{background:#222838;color:var(--fg);border:1px solid #2b3244;border-radius:8px;padding:9px 16px;text-decoration:none;cursor:pointer}
.pager .btn[hidden]{display:none}
footer{padding:24px;text-align:center;color:var(--muted)}
.center{text-align:center}

/* 主页 */
.home{max-width:1200px}
.hero{padding:44px 4px 18px;text-align:center}
.big{font-size:clamp(28px,6vw,42px);margin:0 0 10px;letter-spacing:.5px}
.grad{background:linear-gradient(90deg,#7aa2f7,#bb9af7,#f7768e);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);margin:0 auto 22px;max-width:640px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.search{flex:1;min-width:240px;max-width:480px;background:var(--card);border:1px solid #2b3244;border-radius:999px;
        color:var(--fg);padding:11px 18px;font-size:15px;outline:none}
.search:focus{border-color:var(--acc)}
.tbtn{background:var(--card);border:1px solid #2b3244;color:var(--fg);border-radius:999px;padding:11px 18px;font-size:15px;cursor:pointer}
.tbtn:hover{border-color:var(--acc)}
.a-meta{margin:14px 0 18px;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.acct{display:block;background:var(--card);border:1px solid #232838;border-radius:14px;overflow:hidden;
      text-decoration:none;color:var(--fg);min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.acct:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bnr,.bnr-ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0b0d13}
.bnr-ph{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;
        color:hsl(var(--h,220) 70% 80%);background:linear-gradient(140deg,hsl(var(--h,220) 38% 15%),hsl(var(--h,220) 55% 32%))}
.arow{display:flex;align-items:center;gap:9px;padding:9px 11px;min-width:0}
.av{position:relative;overflow:hidden;flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h,220) 60% 45%)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.col{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.at{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.nk{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nk:empty{display:none}

/* 全屏竖滑查看器 */
.lb{position:fixed;inset:0;z-index:50;background:#000}
.lb[hidden]{display:none}
.lb-track{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;
          -webkit-overflow-scrolling:touch;outline:none}
.lb-slide{height:100vh;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;
          display:flex;align-items:center;justify-content:center;position:relative}
.lb-media{max-width:100vw;max-height:100vh;max-height:100dvh;width:auto;height:auto;object-fit:contain;background:#000}
.lb-close{position:fixed;top:14px;right:16px;z-index:52;width:40px;height:40px;border-radius:50%;
          background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:18px;cursor:pointer}
.lb-rail{position:fixed;right:12px;bottom:36px;z-index:52;display:flex;flex-direction:column;gap:14px;align-items:center}
.lb-act{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.5);color:#fff;
        border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 10px;font-size:18px;cursor:pointer;min-width:52px}
.lb-act span{font-size:12px;color:#cfd6e4}
.lb-act.on{background:rgba(255,64,96,.85);border-color:rgba(255,64,96,.9)}
.lb-info{position:fixed;left:16px;bottom:20px;z-index:52;color:#fff;text-shadow:0 1px 3px #000;font-size:14px}
</style>
</head>
{{end}}

{{define "header"}}
<header><a href="/">Twitter&nbsp;Pic <span class="muted">·</span> Gallery</a></header>
{{end}}

{{define "footer"}}
<footer>server-rendered by Go · html/template</footer>
{{end}}
