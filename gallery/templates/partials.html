{{define "head"}}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{.Title}} · Gallery</title>
<style>:root{
  --bg:#0a0d14;
  --bg-2:#0f1420;
  --fg:#f0f2f7;
  --muted:#7a8399;
  --faint:#4a5468;
  --card:#161b28;
  --card-2:#1d2433;
  --border:#232a3d;
  --border-2:#2d3650;
  --acc:#5b9dff;
  --acc-2:#bb9af7;
  --acc-3:#f7768e;
  --glow:0 0 0 1px rgba(91,157,255,.25),0 4px 20px -4px rgba(91,157,255,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 16px -2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px -6px rgba(0,0,0,.5);
  --radius:14px;
  --radius-sm:10px;
  --radius-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(ellipse 80% 60% at 50% -10%,rgba(91,157,255,.06),transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 100%,rgba(187,154,247,.04),transparent 60%),
    var(--bg);color:var(--fg);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-feature-settings:'cv11','ss01','tnum';min-height:100dvh;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:999px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3d4863}
::selection{background:rgba(91,157,255,.3);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:20;
  padding:max(12px, env(safe-area-inset-top, 12px)) max(24px, env(safe-area-inset-right, 24px)) 12px max(24px, env(safe-area-inset-left, 24px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(10,13,20,.72);
  backdrop-filter:blur(12px) saturate(1.4);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
header a{color:var(--fg);text-decoration:none;font-weight:600;letter-spacing:-.01em}
header a:hover{color:var(--acc)}
.lgbtn{
  padding:6px 14px;border-radius:var(--radius-pill);
  background:var(--card);border:1px solid var(--border-2);color:var(--muted);
  text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;
  transition:all .18s var(--ease);
}
.lgbtn:hover{color:var(--fg);border-color:var(--acc);background:var(--card-2)}

/* ---- main ---- */
main{padding:24px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted)}
.center{text-align:center}
h1{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);background:var(--card-2);color:var(--muted);font-size:12px}

/* ---- tag bar ---- */
.tagbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 24px}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border-2);color:var(--muted);
  border-radius:var(--radius-pill);padding:5px 12px;font-size:13px;cursor:pointer;
  transition:all .18s var(--ease);font-weight:500;
}
.tag span{font-size:11px;color:var(--faint)}
.tag:hover{color:var(--fg);border-color:var(--acc);transform:translateY(-1px)}
.tag.active{
  background:linear-gradient(90deg,rgba(91,157,255,.22),rgba(187,154,247,.22));
  color:#fff;border-color:var(--acc);box-shadow:var(--glow);
}
.tag.active span{color:rgba(255,255,255,.7)}
.tag-clear{border-style:dashed}
.tag-clear:hover{background:rgba(247,118,142,.15);color:var(--acc-3);border-color:var(--acc-3)}

/* ---- home ---- */
.home{max-width:1200px}
.hero{padding:56px 4px 24px;text-align:center;position:relative}
.hero::before{
  content:'';position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:340px;height:130px;
  background:radial-gradient(ellipse at center,rgba(91,157,255,.12),transparent 70%);
  filter:blur(24px);pointer-events:none;
}
.big{
  font-size:clamp(28px,6vw,44px);margin:0 0 12px;font-weight:800;letter-spacing:-.03em;
  position:relative;
}
.grad{
  background:linear-gradient(90deg,#5b9dff,#bb9af7,#f7768e);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{background-position:0% center}50%{background-position:100% center}}
.tagline{color:var(--muted);margin:0 auto 16px;max-width:620px;font-size:15px;line-height:1.7}
.notice{
  max-width:560px;margin:0 auto 22px;padding:9px 18px;border-radius:var(--radius-sm);
  background:rgba(247,118,142,.09);border:1px solid rgba(247,118,142,.28);color:#fca5a5;
  font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.5;
  text-align:center;box-shadow:var(--shadow-sm);
}
.notice-icon{font-size:15px;flex:none}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.search{
  flex:1;min-width:240px;max-width:480px;
  background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius-pill);
  color:var(--fg);padding:11px 20px;font-size:15px;outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  box-shadow:var(--shadow-sm);
}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--acc);box-shadow:var(--glow)}
.tbtn{
  background:var(--card);border:1px solid var(--border-2);color:var(--fg);
  border-radius:var(--radius-pill);padding:11px 20px;font-size:15px;cursor:pointer;
  transition:all .18s var(--ease);font-weight:500;
}
.tbtn:hover{border-color:var(--acc);background:var(--card-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.a-meta{margin:14px 0 22px;font-size:13px;color:var(--faint)}

/* ---- account grid ---- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:12px}
.acct{
  display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  text-decoration:none;color:var(--fg);min-width:0;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);
}
.acct:hover{
  border-color:var(--acc);transform:translateY(-3px);
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(91,157,255,.15);
}
.acct:hover .av{box-shadow:0 0 0 2px rgba(91,157,255,.4)}
.bnr,.bnr-ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0b0d13}
.bnr-ph{
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;
  color:hsl(var(--h,220) 70% 80%);
  background:linear-gradient(140deg,hsl(var(--h,220) 38% 14%),hsl(var(--h,220) 55% 30%));
}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.av{
  position:relative;overflow:hidden;flex:none;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h,220) 60% 45%);
  transition:box-shadow .2s var(--ease);
}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.col{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.at{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.nk{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.nk:empty{display:none}
.tgs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 11px}
.tgs:empty{display:none;padding:0}
.tg{
  font-size:11px;color:var(--acc);background:rgba(91,157,255,.1);border-radius:6px;padding:2px 7px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;
  cursor:pointer;transition:all .15s var(--ease);
}
.tg:hover{background:rgba(91,157,255,.25);color:#fff}
.tg.active{background:var(--acc);color:#fff}

/* ---- account page header ---- */
.uhead{display:flex;align-items:center;gap:16px;margin:0 0 24px}
.uav{
  width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;
  background:linear-gradient(140deg,#1b2f5c,#2d2a4a);border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--muted);
}
.uav img{width:100%;height:100%;object-fit:cover}
.umeta{min-width:0}
.umeta h1{margin:0;font-size:24px;font-weight:700}
.umeta p{margin:2px 0 0;font-size:14px}
.atags{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px;align-items:center}
.atag{display:inline-flex;align-items:center;gap:5px;background:var(--card-2);border:1px solid var(--border-2);color:var(--fg);border-radius:var(--radius-pill);padding:3px 10px;font-size:12.5px;box-shadow:var(--shadow-sm)}
.atag b{font-weight:600;color:var(--acc);font-size:12px}
.atag.up{border-color:var(--acc);background:rgba(91,157,255,.12)}
.atag.down{border-color:var(--acc-3);background:rgba(247,118,142,.12)}
.atag-vote{border:none;background:rgba(122,131,153,.18);color:var(--muted);border-radius:50%;width:18px;height:18px;font-size:13px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .1s}
.atag-vote:hover{background:rgba(122,131,153,.32);color:var(--fg)}
.atag-vote:active{transform:scale(.9)}
.atag-vote.up.on{background:var(--acc);color:#fff}
.atag-vote.down.on{background:var(--acc-3);color:#fff}
.atag-toggle{cursor:pointer;color:var(--muted);background:transparent;border-style:dashed}
.atag-toggle:hover{color:var(--acc);border-color:var(--acc)}
.atag-toggle.on{color:var(--acc);border-color:var(--acc);border-style:solid;background:rgba(91,157,255,.08)}
.atag-add{cursor:pointer;color:var(--muted);background:transparent;border-style:dashed}
.atag-add:hover{color:var(--acc);border-color:var(--acc)}
.atag-input{display:block;margin:0 0 16px;background:var(--card-2);border:1px solid var(--acc);color:var(--fg);border-radius:var(--radius-pill);padding:7px 14px;font-size:13px;outline:none;width:min(280px,70vw);box-shadow:var(--glow)}
.atag-input::placeholder{color:var(--faint)}
.atag-input[hidden]{display:none}

/* ---- media grid (account page) ---- */
.grid{display:flex;gap:16px;align-items:flex-start}
.grid:not(:has(.gcol)){display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;
  display:block;width:100%;
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
}
.card:hover{
  border-color:var(--acc);transform:translateY(-2px);
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(91,157,255,.12);
}
.card img,.card video{width:100%;height:auto;border-radius:6px;background:#0b0d13;display:block;cursor:zoom-in}
.card.has-video::after{
  content:'▶';position:absolute;bottom:10px;left:10px;
  background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:6px;pointer-events:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}

/* ---- modes / filter ---- */
.modes{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.modes a{
  padding:7px 16px;border-radius:var(--radius-pill);background:var(--card);
  color:var(--muted);text-decoration:none;border:1px solid var(--border-2);font-size:14px;
  transition:all .18s var(--ease);font-weight:500;
}
.modes a:hover{color:var(--fg);border-color:var(--acc);background:var(--card-2)}
.modes a.active{
  background:linear-gradient(90deg,rgba(91,157,255,.22),rgba(187,154,247,.18));
  color:#fff;border-color:var(--acc);box-shadow:var(--glow);
}
.modes a.lg{margin-left:auto;color:var(--acc-2);border-color:rgba(187,154,247,.25)}
.modes a.lg:hover{color:var(--acc-2);border-color:var(--acc-2);background:rgba(187,154,247,.08)}

/* ---- pager ---- */
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:24px 0}
.pager .btn{
  background:var(--card);color:var(--fg);border:1px solid var(--border-2);
  border-radius:var(--radius-pill);padding:9px 20px;text-decoration:none;cursor:pointer;
  transition:all .18s var(--ease);font-weight:500;box-shadow:var(--shadow-sm);
}
.pager .btn:hover{border-color:var(--acc);background:var(--card-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.pager .btn[hidden]{display:none}

/* ---- footer ---- */
footer{padding:28px;text-align:center;color:var(--faint);font-size:13px}

/* ---- entrance animations ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.agrid .acct{animation:fadeUp .35s var(--ease) backwards}
.agrid .acct:nth-child(1){animation-delay:.02s}
.agrid .acct:nth-child(2){animation-delay:.04s}
.agrid .acct:nth-child(3){animation-delay:.06s}
.agrid .acct:nth-child(4){animation-delay:.08s}
.agrid .acct:nth-child(5){animation-delay:.10s}
.agrid .acct:nth-child(6){animation-delay:.12s}
.agrid .acct:nth-child(7){animation-delay:.14s}
.agrid .acct:nth-child(8){animation-delay:.16s}
.agrid .acct:nth-child(9){animation-delay:.18s}
.agrid .acct:nth-child(10){animation-delay:.20s}
.agrid .acct:nth-child(11){animation-delay:.22s}
.agrid .acct:nth-child(12){animation-delay:.24s}
.grid .card{animation:fadeUp .3s var(--ease) backwards}
.grid .card:nth-child(1){animation-delay:.02s}
.grid .card:nth-child(2){animation-delay:.04s}
.grid .card:nth-child(3){animation-delay:.06s}
.grid .card:nth-child(4){animation-delay:.08s}
.grid .card:nth-child(5){animation-delay:.10s}
.grid .card:nth-child(6){animation-delay:.12s}
.grid .card:nth-child(7){animation-delay:.14s}
.grid .card:nth-child(8){animation-delay:.16s}
.grid .card:nth-child(9){animation-delay:.18s}
.grid .card:nth-child(10){animation-delay:.20s}
.grid .card:nth-child(11){animation-delay:.22s}
.grid .card:nth-child(12){animation-delay:.24s}

/* ---------- 全屏查看器：手机式（横向翻页 / 缩放 / 下滑关闭） ---------- */
.lb{position:fixed;inset:0;z-index:50;background:#000}
.lb[hidden]{display:none}
.lb-track{display:flex;height:100vh;height:100dvh;overflow-x:auto;overflow-y:hidden;
          scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
          outline:none}
.lb-slide{flex:0 0 100vw;width:100vw;height:100vh;height:100dvh;scroll-snap-align:center;scroll-snap-stop:normal;
          display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-x}
.lb-slide.zoomed{touch-action:none}
.lb-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;will-change:transform}
.lb-stage.anim{transition:transform .24s ease}
.lb-media{max-width:100vw;max-height:100vh;max-height:100dvh;width:auto;height:auto;object-fit:contain;background:#000;
          user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
img.lb-media{cursor:pointer}
.lb-playicon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
             font-size:64px;color:rgba(255,255,255,.88);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.lb-slide.paused .lb-playicon{display:flex}

/* chrome：毛玻璃圆形按钮，统一淡入淡出，3.2s 自动隐藏 */
.lb-close,.lb-nav,.lb-rail,.lb-info,.lb-ind,.lb-vhud{transition:opacity .25s,transform .25s}
.lb.hide-ui .lb-close,.lb.hide-ui .lb-nav,.lb.hide-ui .lb-rail,.lb.hide-ui .lb-info,.lb.hide-ui .lb-ind,.lb.hide-ui .lb-vhud{opacity:0;pointer-events:none}
.lb.hide-ui .lb-vhud{transform:translateY(8px)}
.lb-topfade{position:fixed;top:0;left:0;right:0;height:80px;z-index:51;pointer-events:none;
            background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.lb-bottomfade{position:fixed;bottom:0;left:0;right:0;height:90px;z-index:51;pointer-events:none;
               background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
/* ---------- 全屏查看器安全区与控件定位 ---------- */
.lb-close{
  position:fixed;top:max(14px, env(safe-area-inset-top, 14px));right:max(16px, env(safe-area-inset-right, 16px));z-index:52;
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:18px;line-height:1;
  box-shadow:0 4px 16px -2px rgba(0,0,0,.5);transition:opacity .25s,background .15s;
}
.lb-close:hover{background:rgba(255,255,255,.24)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:52;display:none;pointer-events:auto;
        width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;
        background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.18);color:#fff;font-size:30px;opacity:.6;
        box-shadow:0 4px 16px -2px rgba(0,0,0,.5);
        -webkit-user-select:none;user-select:none;padding:0;transition:opacity .25s,background .15s,transform .15s}
.lb-nav b{font-weight:400;line-height:1;margin-top:-5px}
.lb-prev{left:18px}
.lb-next{right:18px}
@media (hover:hover) and (pointer:fine){.lb-nav{display:flex}}
.lb-nav:hover{opacity:1;background:rgba(255,255,255,.22);transform:translateY(-50%) scale(1.05)}
.lb-nav.dis{opacity:.15;pointer-events:none}
.lb-ind{
  position:fixed;top:max(18px, env(safe-area-inset-top, 18px));left:50%;transform:translateX(-50%);z-index:52;
  padding:5px 14px;border-radius:999px;
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;letter-spacing:.6px;
  box-shadow:0 4px 16px -2px rgba(0,0,0,.5);
}
.lb-rail{
  position:fixed;right:max(14px, env(safe-area-inset-right, 14px));bottom:max(36px, calc(env(safe-area-inset-bottom, 0px) + 24px));
  z-index:52;display:flex;flex-direction:column;gap:16px;align-items:center;
}
.lb-act{display:flex;flex-direction:column;align-items:center;gap:2px;
        background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 10px;font-size:18px;cursor:pointer;min-width:52px;
        box-shadow:0 4px 16px -2px rgba(0,0,0,.5);transition:opacity .25s,background .15s,transform .15s}
.lb-act:hover{background:rgba(255,255,255,.2);transform:scale(1.05)}
.lb-act span{font-size:12px;color:#e6e9ef}
.lb-act.on{background:rgba(255,64,96,.85);border-color:rgba(255,64,96,.9)}
.lb-act.on:hover{background:rgba(255,64,96,.95)}
.lb-info{
  position:fixed;left:max(16px, env(safe-area-inset-left, 16px));bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
  z-index:52;color:#fff;text-shadow:0 1px 3px #000;font-size:14px;opacity:.9;
  transition:bottom .25s var(--ease),opacity .25s;
  max-width:calc(100vw - 120px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lb.has-vhud .lb-info{bottom:max(88px, calc(env(safe-area-inset-bottom, 0px) + 78px))}

/* ---------- 视频播放器 HUD ---------- */
.lb-vhud{
  position:fixed;left:max(16px, env(safe-area-inset-left, 16px));bottom:max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  right:max(76px, calc(env(safe-area-inset-right, 0px) + 70px));z-index:53;
  background:rgba(18,22,33,.84);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:8px 14px 6px;
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 1px rgba(91,157,255,.12);
  display:flex;flex-direction:column;gap:6px;
  color:#fff;
  user-select:none;-webkit-user-select:none;
}
.lb-vhud[hidden]{display:none}

/* 进度条轨道 */
.lb-vprog{
  position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;
}
.lb-vprog::before{
  content:'';position:absolute;left:0;right:0;height:4px;border-radius:2px;
  background:rgba(255,255,255,.2);transition:height .15s ease;
}
.lb-vprog:hover::before{height:6px}
.lb-vprog-buf{
  position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:2px;
  background:rgba(255,255,255,.38);pointer-events:none;width:0%;
  transition:height .15s ease;
}
.lb-vprog:hover .lb-vprog-buf{height:6px}
.lb-vprog-bar{
  position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:2px;
  background:linear-gradient(90deg,#5b9dff,#bb9af7);pointer-events:none;width:0%;
  box-shadow:0 0 8px rgba(91,157,255,.6);transition:height .15s ease;
}
.lb-vprog:hover .lb-vprog-bar{height:6px}
.lb-vprog-thumb{
  position:absolute;top:50%;left:0%;transform:translate(-50%,-50%) scale(0);
  width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px rgba(91,157,255,.9),0 2px 4px rgba(0,0,0,.5);
  pointer-events:none;transition:transform .15s ease;
}
.lb-vprog:hover .lb-vprog-thumb,.lb-vprog.scrubbing .lb-vprog-thumb{transform:translate(-50%,-50%) scale(1)}
.lb-vprog-tip{
  position:absolute;bottom:22px;left:0;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:2px 6px;border-radius:4px;
  font-size:11px;font-family:monospace;pointer-events:none;display:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
}
.lb-vprog:hover .lb-vprog-tip{display:block}

/* 控制按钮与时间 */
.lb-vbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lb-vleft,.lb-vright{display:flex;align-items:center;gap:6px}
.lb-vbtn{
  background:transparent;border:none;color:#e2e8f0;cursor:pointer;
  padding:5px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;line-height:1;font-size:13px;
}
.lb-vbtn:hover{background:rgba(255,255,255,.15);color:#fff;transform:scale(1.05)}
.lb-vbtn:active{transform:scale(.95)}
.lb-vbtn svg{display:block}
.lb-vtime{font-size:12.5px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;margin-left:4px}
.lb-vspeed{font-weight:600;font-size:12px;padding:3px 7px;background:rgba(255,255,255,.08);border-radius:4px}
.lb-vspeed:hover{background:rgba(255,255,255,.2)}
.lb-vvol{display:flex;align-items:center;gap:4px;position:relative}
.lb-vslider{
  width:64px;height:4px;accent-color:#5b9dff;cursor:pointer;opacity:.75;
  transition:opacity .15s ease;
}
.lb-vslider:hover{opacity:1}

/* 播放/暂停 icon 切换 */
.lb-vhud.paused .ico-pause{display:none}
.lb-vhud.paused .ico-play{display:block}
.lb-vhud:not(.paused) .ico-pause{display:block}
.lb-vhud:not(.paused) .ico-play{display:none}

/* 静音 icon 切换 */
.lb-vhud.muted .ico-vol-high{display:none}
.lb-vhud.muted .ico-vol-mute{display:block}
.lb-vhud:not(.muted) .ico-vol-high{display:block}
.lb-vhud:not(.muted) .ico-vol-mute{display:none}

/* 全屏 icon 切换 */
.lb-vhud.is-fs .ico-fs{display:none}
.lb-vhud.is-fs .ico-unfs{display:block}
.lb-vhud:not(.is-fs) .ico-fs{display:block}
.lb-vhud:not(.is-fs) .ico-unfs{display:none}

/* ---------- 手机端深度适配响应式规则 ---------- */
@media (max-width:640px){
  header{padding:max(10px, env(safe-area-inset-top, 10px)) max(14px, env(safe-area-inset-right, 14px)) 10px max(14px, env(safe-area-inset-left, 14px))}
  main{padding:14px 10px;max-width:100%}

  /* 主页 */
  .hero{padding:26px 4px 14px}
  .big{font-size:25px;margin-bottom:8px}
  .tagline{font-size:13px;line-height:1.55;margin-bottom:12px}
  .notice{font-size:12.5px;padding:7px 12px;margin:0 auto 14px;gap:6px}
  .tools{gap:8px}
  .search{width:100%;min-width:0;padding:9px 16px;font-size:14px}
  .tbtn{padding:9px 16px;font-size:13.5px}
  .a-meta{margin:10px 0 16px;font-size:12px}
  .tagbar{gap:5px;margin:0 0 14px}
  .tag{padding:3px 9px;font-size:12px;min-height:30px}

  /* 账号卡片：手机双列网格 */
  .agrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .acct{border-radius:10px}
  .arow{padding:7px 8px;gap:6px}
  .av{width:26px;height:26px;font-size:11px}
  .at{font-size:12px}
  .nk{font-size:10.5px}
  .tgs{gap:3px;padding:0 8px 7px}
  .tg{font-size:10px;padding:1px 5px}

  /* 账号主页头部 */
  .uhead{gap:12px;margin:0 0 14px}
  .uav{width:46px;height:46px;font-size:18px}
  .umeta h1{font-size:19px}
  .umeta p{font-size:12.5px}
  .atags{gap:4px;margin:-4px 0 12px}
  .atag{padding:2px 8px;font-size:11.5px}
  .atag-input{max-width:100%;font-size:12px;padding:6px 12px}

  /* 筛选模式条：手机横向滑动手感 */
  .modes{
    gap:6px;margin:0 0 14px;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;
  }
  .modes::-webkit-scrollbar{display:none}
  .modes a{padding:6px 12px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
  .modes a.lg{margin-left:0}

  /* 媒体瀑布流：双列紧凑卡片，边距压缩提升内容可视面积 */
  .grid{gap:8px}
  .grid:not(:has(.gcol)){grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .gcol{gap:8px}
  .card{padding:4px;border-radius:8px}
  .card img,.card video{border-radius:5px}

  /* 分页按钮 */
  .pager{gap:10px;margin:18px 0}
  .pager .btn{padding:8px 16px;font-size:13px;min-height:38px;display:inline-flex;align-items:center}

  /* 灯箱查看器 */
  .lb-close{
    top:max(12px, env(safe-area-inset-top, 12px));right:max(12px, env(safe-area-inset-right, 12px));
    width:38px;height:38px;font-size:16px;
  }
  .lb-ind{top:max(14px, env(safe-area-inset-top, 14px));padding:3px 10px;font-size:11.5px}
  .lb-rail{
    right:max(10px, env(safe-area-inset-right, 10px));
    bottom:max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));
    gap:10px;
  }
  .lb-act{min-width:44px;padding:6px 8px;font-size:15px;border-radius:12px}
  .lb-act span{font-size:10.5px}
  .lb-info{
    left:max(12px, env(safe-area-inset-left, 12px));
    bottom:max(16px, calc(env(safe-area-inset-bottom, 0px) + 12px));
    font-size:12px;max-width:calc(100vw - 110px);
  }
  .lb.has-vhud .lb-info{bottom:max(78px, calc(env(safe-area-inset-bottom, 0px) + 68px))}

  /* 视频 HUD */
  .lb-vhud{
    left:max(10px, env(safe-area-inset-left, 10px));
    right:max(62px, calc(env(safe-area-inset-right, 0px) + 56px));
    bottom:max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
    border-radius:12px;padding:5px 9px 3px;gap:3px;
  }
  .lb-vprog{height:20px}
  .lb-vprog-thumb{width:16px;height:16px}
  .lb-vbtn{padding:5px 3px;min-width:30px;min-height:30px;font-size:12px}
  .lb-vtime{font-size:10.5px;margin-left:2px}
  .lb-vspeed{font-size:10.5px;padding:2px 5px}
  .lb-vslider{display:none}
}

@media (max-width:340px){
  .agrid{grid-template-columns:1fr}
}
/* ---- reduced motion ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
}</style>
</head>
{{end}}
